# usque (Cloudflare WARP / MASQUE) — настройки службы на Keenetic OS (OPKG / Entware).
# После правки: /opt/etc/init.d/S99usque restart

# 1 — включить службу, 0 — выключить
ENABLED=1

# socks | l4-socks | http-proxy | l4-http-proxy | nativetun
MODE=socks

# адрес и порт прокси-режимов (0.0.0.0 — доступ из локальной сети)
BIND=127.0.0.1
PORT=1080

# конфиг, созданный командой usque register
CONFIG=/opt/etc/usque/config.json

# дополнительные аргументы командной строки usque:
#   обход ТСПУ — --bypass (по умолчанию), свой SNI — --bypass-sni www.example.com,
#   больше попыток сразу — --bypass-parallel 5, маленькое рукопожатие — --tls-curve p256,
#   имя устройства для nativetun — -n usque0
ARGS="--bypass"
