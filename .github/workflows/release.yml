name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty = auto, e.g. v2026.10.11-42)'
        required: false
        default: ''

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for GitHub Releases and pushing the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags, required by GoReleaser

      - name: Resolve release tag
        id: tag
        # On manual runs from a branch there is no tag, which makes GoReleaser
        # fail with "git doesn't contain any tags". Create one on HEAD.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v$(date -u +%Y.%m.%d)-${{ github.run_number }}"
            fi
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG"
            git push -f origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Релиз: $TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Пакеты для роутеров добавляются в тот же релиз, что и бинарники всех ОС.
  openwrt:
    name: OpenWrt ipk
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/build-ipk.yml
    with:
      version: ${{ needs.release.outputs.tag }}
      release: true

  keenetic:
    name: Keenetic ipk
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/build-keenetic.yml
    with:
      version: ${{ needs.release.outputs.tag }}
      release: true
